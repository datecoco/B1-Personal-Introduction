<!DOCTYPE html>
<html lang="ko">

<head>
  <!-- 💡 글자 인코딩: 한글이 깨지지 않게 설정 -->
  <meta charset="UTF-8">

  <!-- 💡 모바일 화면 크기에 맞춰 웹페이지를 표시 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- 💡 브라우저 탭에 표시되는 제목 -->
  <title>나의 포트폴리오</title>

  <!-- 💡 CSS 파일 연결: 화면 디자인 담당 -->
  <link rel="stylesheet" href="css/style.css">

  <!-- 💡 JavaScript 파일 연결: 기능 담당
       defer는 HTML을 먼저 읽은 뒤 JavaScript를 실행하게 함 -->
  <script src="js/main.js" defer></script>
</head>

<body>
  <!-- ================================
       💡 상단 메뉴 영역
       ================================ -->
  <header>
    <!-- aria-label은 화면 읽기 도구에 메뉴의 역할을 알려 줌 -->
    <nav aria-label="주 메뉴">
      <!-- 사이트 이름을 누르면 첫 화면으로 이동 -->
      <a href="#hero">MY PAGE</a>

      <!-- 💡 모바일에서 보이는 메뉴 열기 버튼 -->
      <button
        id="menuBtn"
        aria-controls="menu"
        aria-expanded="false">
        메뉴
      </button>

      <!-- 💡 메뉴 링크 상자
           화면이 좁을 때는 JavaScript가 active class를 붙여 열어 줌 -->
      <div id="menu">
        <a href="#hero">홈</a>
        <a href="#about">소개</a>
        <a href="#skills">기술</a>
        <a href="#projects">프로젝트</a>
        <a href="#contact">문의</a>
      </div>

      <!-- 💡 누르면 다크 모드와 밝은 모드를 바꾸는 버튼 -->
      <button id="themeBtn">다크 모드</button>
    </nav>
  </header>

  <!-- ================================
       💡 웹페이지의 주요 내용
       ================================ -->
  <main>
    <!-- 💡 첫 화면: 인사말과 프로젝트 이동 링크 -->
    <section id="hero">
      <h1>안녕하세요, 웹을 배우는 ○○○입니다.</h1>
      <p>직접 만든 첫 웹페이지입니다.</p>
      <a href="#projects">프로젝트 보기</a>
    </section>

    <!-- 💡 자기소개 영역 -->
    <section id="about">
      <h2>나의 소개</h2>

      <!-- src는 이미지 파일 위치, alt는 사진 설명 -->
      <img
        src="images/profile.jpg"
        alt="나의 프로필 사진"
        width="180">

      <p>내가 좋아하는 일과 앞으로의 목표를 적어보세요.</p>
    </section>

    <!-- 💡 배우는 기술 목록 -->
    <section id="skills">
      <h2>배우는 기술</h2>
      <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
      </ul>
    </section>

    <!-- 💡 GitHub API에서 가져온 프로젝트 카드 영역 -->
    <section id="projects">
      <h2>프로젝트</h2>

      <!-- JavaScript가 성공 상태일 때만 이 라벨과 선택 상자를 보이게 함 -->
      <label id="languageFilterLabel" for="languageFilter" hidden>
        언어별 보기
      </label>

      <!-- 💡 프로젝트 언어를 선택하는 필터 -->
      <select id="languageFilter" hidden disabled>
        <option value="all">모든 언어</option>
      </select>

      <!-- 💡 로딩·오류·빈 결과 상태 문구가 표시되는 곳 -->
      <p id="projectStatus" role="status"></p>

      <!-- 💡 API 오류일 때만 JavaScript가 보이게 하는 버튼 -->
      <button id="retry" hidden>다시 시도</button>

      <!-- 💡 JavaScript가 GitHub 저장소 카드들을 넣는 빈 상자 -->
      <div id="cards"></div>
    </section>

    <!-- 💡 문의 폼 영역 -->
    <section id="contact">
      <h2>문의하기</h2>

      <!-- novalidate: 브라우저 기본 오류 대신 JavaScript 검사 사용 -->
      <form id="contactForm" novalidate>
        <!-- for="name"과 id="name"을 연결 -->
        <label for="name">이름</label>
        <input
          id="name"
          required
          aria-describedby="nameError">

        <!-- JavaScript가 이름 입력칸의 오류 문구를 표시 -->
        <small
          id="nameError"
          class="error"
          aria-live="polite">
        </small>

        <label for="email">이메일</label>
        <input
          id="email"
          type="email"
          required
          aria-describedby="emailError">

        <!-- JavaScript가 이메일 입력칸의 오류 문구를 표시 -->
        <small
          id="emailError"
          class="error"
          aria-live="polite">
        </small>

        <label for="message">메시지</label>
        <textarea
          id="message"
          required
          aria-describedby="messageError">
        </textarea>

        <!-- JavaScript가 메시지 입력칸의 오류 문구를 표시 -->
        <small
          id="messageError"
          class="error"
          aria-live="polite">
        </small>

        <!-- 실제 전송 대신 입력값 검사만 실행 -->
        <button type="submit">입력 확인</button>

        <!-- 입력 검사 결과 문구가 표시되는 곳 -->
        <p id="formStatus" role="status"></p>
      </form>
    </section>
  </main>

  <!-- ================================
       💡 페이지 하단 정보
       ================================ -->
  <footer>
    <p>© 2026 ○○○</p>

    <!-- 💡 YOUR_ID를 본인 GitHub 아이디 datecoco로 바꿔도 됨 -->
    <a href="https://github.com/datecoco">GitHub</a>
  </footer>

  <!-- 💡 아래로 스크롤했을 때 JavaScript가 보이게 하는 버튼 -->
  <button id="topBtn" hidden>맨 위로</button>
</body>

</html>
